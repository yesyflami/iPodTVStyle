org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Package name for the launcher — the one line most people need to edit.
#
# Your TV only accepts an app as the *default home screen* if it is installed
# under a package name the firmware has on its allow-list. Known values:
#
#   Skyworth / SkyOS (Coocaa)     com.coocaa.tvhome
#   Sony / Google TV              com.google.android.tvlauncher
#   Xiaomi / Mi TV (PatchWall)    com.mitv.tvhome
#   TCL Android TV                com.tcl.tvlauncher
#
# Find yours:
#   adb shell cmd package resolve-activity -c android.intent.category.HOME
#   adb shell dumpsys package <package> | grep -B2 -A4 android.intent.category.HOME
#
# Full walkthrough: docs/ADAPT.md
# ---------------------------------------------------------------------------
homeApplicationId=com.coocaa.tvhome
