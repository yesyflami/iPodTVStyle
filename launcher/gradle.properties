org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Package name the launcher installs as.
#
# Leave this alone unless the TV's firmware only hands HOME to a package name on
# its own allow-list (Coocaa/Skyworth, some Xiaomi and ColorOS builds do). Then
# set it per build instead of editing this file:
#
#   tools/build.sh -PlauncherApplicationId=<package>
#   powershell ... tools\build.ps1 -LauncherApplicationId <package>
#
# Which name a given model needs, and whether it needs one at all, is written
# per model under docs/devices/. The default stays neutral on purpose: a vendor
# prefix (com.coocaa.*, com.mitv.*) imports that vendor's problems on every
# other TV, and can collide with a system package of the same name.
#
# launcherApplicationId=com.coocaa.cleanhome
# ---------------------------------------------------------------------------
